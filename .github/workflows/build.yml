name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - run: uv run --no-env-file --no-sync ruff check .
      - run: uv run --no-env-file --no-sync ruff format --check .
      - run: uv run --no-env-file --no-sync mypy
      - run: uv run --no-env-file --no-sync pyright

  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --no-default-groups --group build --python "${{ steps.python.outputs.python-path }}"
      - run: uv run --no-env-file --no-sync python -B -m unittest discover -s tests -v

  release:
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - id: semantic
        run: npx --yes -p semantic-release@24 -p @semantic-release/exec@6 semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: [test, release]
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (needs.release.outputs.tag != '' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - if: matrix.os == 'macos-15-intel'
        run: |
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: uv sync --locked --no-default-groups --group build --python "${{ steps.python.outputs.python-path }}"
      - run: uv run --no-env-file --no-sync python scripts/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: SecretManager-${{ matrix.os }}
          path: dist/SecretManager*
          if-no-files-found: error
      - if: needs.release.outputs.tag != ''
        shell: bash
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/SecretManager* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [release, build]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft once every platform is attached
        run: |
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length')
          test "$count" -eq "$EXPECTED"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          EXPECTED: "4"
