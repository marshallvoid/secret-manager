line-length = 120
target-version = "py310"
extend-exclude = ["dist", "build", ".venv"]

[lint]
select = ["E", "W", "F", "ANN", "I", "B", "UP", "C4", "SIM", "RUF", "PIE"]
ignore = [
    "UP006", # Keep collection annotations from typing, as required by AGENTS.md.
    "UP007", # Keep typing.Union.
    "UP035", # Keep collection imports from typing.
    "UP045", # Keep typing.Optional.
    "E501", # Let the formatter handle line length.
    "RUF001", # Allow Vietnamese text and UI punctuation.
    "RUF012", # Qt test fixtures use class attributes.
    "SIM105", # Explicit exception handling is easier to read here.
]

[lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"] # Set the headless Qt platform before importing Qt.
# Firestore fields accept heterogeneous SDK-native values, with explicit Any annotations.
"secret_manager/gcp/firestore/values.py" = ["ANN401"]
"secret_manager/gcp/firestore/field_editor.py" = ["ANN401"]
"secret_manager/gcp/firestore/dialogs.py" = ["ANN401"]
"secret_manager/gcp/firestore/document_panel.py" = ["ANN401"]
