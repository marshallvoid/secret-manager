repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: .venv/bin/python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: .venv/bin/python -m ruff format --check
        language: system
        types_or: [python, pyi]
