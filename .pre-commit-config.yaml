repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --no-env-file --locked --group dev --group build ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --no-env-file --locked --group dev --group build ruff format --check
        language: system
        types_or: [python, pyi]
